name: GolfApp
options:
  bundleIdPrefix: com.bobby
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hant
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 8R3YFLDYKM
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GolfKit:
    path: GolfKit
targets:
  GolfApp:
    type: application
    platform: iOS
    sources:
      - path: GolfApp
        excludes:
          - "Resources/featured"
          - "Resources/featured/**"
      - path: GolfApp/Resources/featured
        type: folder
        buildPhase: resources
    dependencies:
      - package: GolfKit
        product: GolfKit
      - target: GolfWatch
      - target: GolfWidgets
    entitlements:
      path: GolfApp/GolfApp.entitlements
      properties:
        com.apple.developer.weatherkit: true
        com.apple.security.application-groups: [group.com.bobby.golfapp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobby.golfapp
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    info:
      path: GolfApp/Info.plist
      properties:
        CFBundleDisplayName: 高手
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleLocalizations: [zh-Hant, en]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: 用於顯示附近球場與記錄每桿位置、計算到果嶺距離。
        NSMotionUsageDescription: 用於偵測揮桿自動記桿。
        NSHealthShareUsageDescription: 用於在回合中以體能訓練模式持續偵測揮桿。
        NSHealthUpdateUsageDescription: 回合結束後將高爾夫體能訓練存入健康 App。
        NSCameraUsageDescription: 用於拍攝球洞照片與掃描紙本記分卡。
        NSPhotoLibraryUsageDescription: 用於從相簿選擇紙本記分卡照片。
        NSSupportsLiveActivities: true
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.bobby.golfapp.course
            UTTypeDescription: Golf Course
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [golfcourse]
          - UTTypeIdentifier: com.bobby.golfapp.round
            UTTypeDescription: Golf Round
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [golfround]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Golf Course
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.bobby.golfapp.course]
          - CFBundleTypeName: Golf Round
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.bobby.golfapp.round]
  GolfWatch:
    type: application
    platform: watchOS
    sources:
      - GolfWatch
    dependencies:
      - package: GolfKit
        product: GolfKit
      - sdk: HealthKit.framework
      - target: GolfWatchWidgets
    entitlements:
      path: GolfWatch/GolfWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.com.bobby.golfapp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobby.golfapp.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    info:
      path: GolfWatch/Info.plist
      properties:
        CFBundleDisplayName: 高手
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleLocalizations: [zh-Hant, en]
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.bobby.golfapp
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes: [workout-processing]
        NSLocationWhenInUseUsageDescription: 用於記錄每桿位置並計算到果嶺距離。
        NSMotionUsageDescription: 用於偵測揮桿自動記桿。
        NSHealthShareUsageDescription: 用於在回合中以體能訓練模式持續偵測揮桿。
        NSHealthUpdateUsageDescription: 回合結束後將高爾夫體能訓練存入健康 App。
  GolfWidgets:
    type: app-extension
    platform: iOS
    sources:
      - GolfWidgets
    dependencies:
      - package: GolfKit
        product: GolfKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: GolfWidgets/GolfWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.bobby.golfapp]
    info:
      path: GolfWidgets/Info.plist
      properties:
        CFBundleDisplayName: GolfApp
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobby.golfapp.widgets
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  GolfWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - GolfWatchWidgets
    dependencies:
      - package: GolfKit
        product: GolfKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: GolfWatchWidgets/GolfWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.bobby.golfapp]
    info:
      path: GolfWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: GolfApp
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobby.golfapp.watchkitapp.widgets
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  GolfAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GolfAppUITests
    dependencies:
      - target: GolfApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobby.golfapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GolfApp
  GolfWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - GolfWatchUITests
    dependencies:
      - target: GolfWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobby.golfapp.watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GolfWatch
schemes:
  GolfApp:
    build:
      targets:
        GolfApp: all
        GolfWatch: all
    run:
      config: Debug
    test:
      targets:
        - GolfAppUITests
  GolfWatch:
    build:
      targets:
        GolfWatch: all
    test:
      targets:
        - GolfWatchUITests
